<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>アチャ パチャ ノチャ</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f4ee;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#202020}
.app{height:100dvh;padding:5px 8px;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:4px}
.top,.select{display:flex;align-items:center;gap:6px;min-height:38px}.title{font-size:clamp(20px,2.4vw,29px);font-weight:950}.spacer{flex:1}
.panel{background:#fff;border:2px solid #d8d3c8;border-radius:13px;padding:4px 7px;display:flex;align-items:center;gap:5px}
.label{font-size:13px;font-weight:850;color:#666}button{border:0;border-radius:10px;min-height:35px;padding:5px 9px;font:inherit;font-weight:850;background:#ece8df}
button[aria-pressed=true]{outline:3px solid #7fb7c4;background:#cfe7ec}.primary{background:#2d6a78;color:#fff}.secondary{background:#dfeff2;color:#16434c}.bpm{font-size:21px;font-weight:950;min-width:45px;text-align:center}
.lineBtn{min-width:72px}.info{font-size:12px;font-weight:800;color:#666}
.main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 215px;gap:5px}
.scoreCard{min-height:0;background:#fff;border:2px solid #d8d3c8;border-radius:15px;padding:3px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.scoreWrap{width:100%;height:100%;position:relative;display:flex;align-items:center;justify-content:center}.scoreWrap img{width:100%;height:100%;object-fit:contain}
.cursor{position:absolute;top:12%;height:76%;width:6px;border-radius:4px;opacity:0;box-shadow:0 0 0 3px #fff}.cursor.show{opacity:1}.strong{background:#d93025}.weak{background:#1769aa}
.side{min-height:0;display:flex;flex-direction:column;gap:4px}.now,.beatbox{background:#fff;border:2px solid #d8d3c8;border-radius:15px;text-align:center;padding:6px}.now{flex:1;display:flex;flex-direction:column;justify-content:center}
.count{font-size:clamp(38px,5vw,58px);font-weight:950;color:#2d6a78;line-height:1;min-height:.9em}.small{font-size:12px;font-weight:800;color:#666}.group{font-size:clamp(34px,4.3vw,50px);font-weight:950}.round{font-size:14px;font-weight:900;color:#2d6a78}.instruction{font-size:14px;font-weight:850}
.dots{display:grid;grid-template-columns:repeat(4,26px);grid-template-rows:repeat(2,26px);gap:5px 6px;justify-content:center;margin-top:5px}.dot{width:26px;height:26px;border-radius:50%;background:#ddd8cf}.dot.on.strong{background:#d93025}.dot.on.weak{background:#1769aa}.status{font-size:12px;font-weight:800;color:#666;text-align:center}
.footer{display:flex;justify-content:center;align-items:center;gap:6px;min-height:39px}.soundtxt{font-size:11px;font-weight:800;color:#666}
@media(max-height:700px) and (orientation:landscape){.app{padding:3px 6px}.top,.select{min-height:33px}button{min-height:31px;padding:3px 7px}.main{grid-template-columns:minmax(0,1fr) 195px}.footer{min-height:34px}.title{font-size:20px}}
</style></head><body><div class="app">
<div class="top"><div class="title">🎵 アチャ パチャ ノチャ</div><div class="spacer"></div><div class="panel"><span class="label">テンポ</span><button id="minus">−</button><span class="bpm" id="bpm">100</span><button id="plus">＋</button><button class="preset" data-bpm="80">80</button><button class="preset" data-bpm="100" aria-pressed="true">100</button><button class="preset" data-bpm="120">120</button><button class="preset" data-bpm="132">132</button></div></div>
<div class="select"><div class="panel" style="flex:1"><span class="label">練習する段（複数選択）</span><button class="lineBtn" data-line="0" aria-pressed="true">1段目</button><button class="lineBtn" data-line="1" aria-pressed="false">2段目</button><button class="lineBtn" data-line="2" aria-pressed="false">3段目</button><span class="info" id="info">1段目を練習</span></div></div>
<div class="main"><div class="scoreCard"><div class="scoreWrap"><img id="score"><div id="cursor" class="cursor"></div></div></div>
<div class="side"><div class="now"><div id="count" class="count"></div><div class="small">いま演奏する人</div><div id="group" class="group">スタート前</div><div id="round" class="round">段を選んでください</div><div id="inst" class="instruction">先生はスタートを押すだけ</div></div>
<div class="beatbox"><div class="small">よびはく・4拍子（2小節）</div><div class="dots"><div class="dot" id="d0"></div><div class="dot" id="d1"></div><div class="dot" id="d2"></div><div class="dot" id="d3"></div><div class="dot" id="d4"></div><div class="dot" id="d5"></div><div class="dot" id="d6"></div><div class="dot" id="d7"></div></div></div><div id="status" class="status">1列 → 2列 → 3列</div></div></div>
<div class="footer"><button class="primary" id="start">▶ スタート</button><button class="secondary" id="pause">⏸ 一時停止</button><button id="reset">↺ 最初から</button><button id="sound" aria-pressed="true">🔊 拍の音 ON</button><span class="soundtxt">大きめ：強・弱・弱・弱</span></div>

(()=>{const $=x=>document.getElementById(x),score=$('score'),cursor=$('cursor'),bpmE=$('bpm'),info=$('info'),group=$('group'),round=$('round'),inst=$('inst'),status=$('status'),count=$('count');
const lineBtns=[...document.querySelectorAll('.lineBtn')],presets=[...document.querySelectorAll('.preset')],dots=[0,1,2,3,4,5,6,7].map(i=>$('d'+i));
let bpm=100,soundOn=true,running=false,paused=false,g=0,beat=0,timer=null,ctx=null,selected=new Set([0]),pos=0;const groups=['1列','2列','3列'],PRE=8,LINE=16,GAP=4;
const ordered=()=>[0,1,2].filter(i=>selected.has(i));const label=()=>ordered().map(i=>(i+1)+'段目').join('・');const ms=()=>60000/bpm;
function update(){info.textContent=label()+'を練習'}function show(i){score.src=ASSETS[i]}
function setBpm(v){bpm=Math.max(60,Math.min(150,v));bpmE.textContent=bpm;presets.forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.bpm===bpm)));if(running&&!paused)restart()}
function audio(){try{if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}catch(e){}}
function click(strong){if(!soundOn)return;audio();if(!ctx)return;let o=ctx.createOscillator(),a=ctx.createGain();o.frequency.value=720;let peak=strong?.38:.23;a.gain.setValueAtTime(.0001,ctx.currentTime);a.gain.exponentialRampToValueAtTime(peak,ctx.currentTime+.003);a.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.075);o.connect(a);a.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.08)}
function clear(){dots.forEach(d=>d.classList.remove('on','strong','weak'))}function light(i){clear();dots[i].classList.add('on',i%4===0?'strong':'weak')}
function move(local){cursor.style.left=(6.5+local/(LINE-1)*87)+'%';cursor.classList.remove('strong','weak');cursor.classList.add(local%4===0?'strong':'weak','show')}
function render(){let a=ordered();group.textContent=groups[g];if(beat<PRE){count.textContent=PRE-beat;round.textContent='よびはく';inst.textContent='4拍子にのって じゅんび';status.textContent='🔴・🔵・🔵・🔵｜🔴・🔵・🔵・🔵';light(beat);cursor.classList.remove('show','strong','weak');click(beat%4===0);show(a[0])}
else if(beat<PRE+LINE*a.length){count.textContent='';round.textContent='演奏';inst.textContent=label()+'をつづけて演奏';status.textContent='吹かない列は、音を出さずに指だけ';clear();let sb=beat-PRE,w=Math.floor(sb/LINE),local=sb%LINE;if(w!==pos){pos=w;show(a[pos])}move(local);click(sb%4===0)}
else{count.textContent='';round.textContent='交代';inst.textContent='つぎの列へ';status.textContent='リコーダーを口からはなして準備';clear();cursor.classList.remove('show','strong','weak')}}
function tick(){if(!running||paused)return;render();beat++;if(beat>=PRE+LINE*ordered().length+GAP){beat=0;pos=0;g++;if(g>=3)finish();else show(ordered()[0])}}
function restart(){clearInterval(timer);timer=setInterval(tick,ms())}function lock(v){lineBtns.forEach(b=>b.disabled=v);presets.forEach(b=>b.disabled=v);$('minus').disabled=v;$('plus').disabled=v}
function start(){if(running&&paused){paused=false;$('pause').textContent='⏸ 一時停止';restart();return}if(running)return;audio();running=true;paused=false;g=0;beat=0;pos=0;lock(true);show(ordered()[0]);$('start').textContent='演奏中…';tick();restart()}
function pause(){if(!running)return;paused=!paused;if(paused){clearInterval(timer);timer=null;$('pause').textContent='▶ つづき';inst.textContent='一時停止';count.textContent='';clear();cursor.classList.remove('show','strong','weak')}else{$('pause').textContent='⏸ 一時停止';restart()}}
function reset(){clearInterval(timer);timer=null;running=false;paused=false;g=0;beat=0;pos=0;lock(false);group.textContent='スタート前';round.textContent='段を選んでください';inst.textContent='先生はスタートを押すだけ';status.textContent='1列 → 2列 → 3列';count.textContent='';$('start').textContent='▶ スタート';$('pause').textContent='⏸ 一時停止';clear();cursor.classList.remove('show','strong','weak');show(ordered()[0])}
function finish(){clearInterval(timer);timer=null;running=false;paused=false;lock(false);group.textContent='おしまい！';round.textContent='リコーダータイム';inst.textContent='4拍子の感じはどうだった？';status.textContent='3拍子とのちがいも感じてみよう';$('start').textContent='▶ もう一度';count.textContent='';clear();cursor.classList.remove('show','strong','weak')}
lineBtns.forEach(b=>b.onclick=()=>{if(running)return;let n=+b.dataset.line;if(selected.has(n)){if(selected.size===1)return;selected.delete(n)}else selected.add(n);lineBtns.forEach(x=>x.setAttribute('aria-pressed',String(selected.has(+x.dataset.line))));update();show(ordered()[0])});
$('start').onclick=start;$('pause').onclick=pause;$('reset').onclick=reset;$('minus').onclick=()=>setBpm(bpm-4);$('plus').onclick=()=>setBpm(bpm+4);presets.forEach(b=>b.onclick=()=>setBpm(+b.dataset.bpm));$('sound').onclick=()=>{soundOn=!soundOn;$('sound').setAttribute('aria-pressed',String(soundOn));$('sound').textContent=soundOn?'🔊 拍の音 ON':'🔇 拍の音 OFF';if(soundOn)audio()};update();show(0)})();
</script></body></html>
