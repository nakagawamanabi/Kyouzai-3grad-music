<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>リコーダータイム｜雨上がり</title>
<style>
  :root {
    --bg:#f7f4ec;
    --panel:#ffffff;
    --ink:#202020;
    --muted:#6d6d6d;
    --accent:#2d6a78;
    --accent2:#dfeff2;
    --line:#d8d3c8;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;padding:0;width:100%;height:100%;overflow:hidden;
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  }
  body{touch-action:manipulation}
  .app{
    height:100dvh;display:grid;
    grid-template-rows:auto minmax(0,1fr) auto;
    gap:8px;padding:10px 12px;
  }
  .topbar{display:flex;align-items:center;gap:7px;min-height:58px;white-space:nowrap}
  .title{font-weight:900;font-size:clamp(23px,3vw,34px)}
  .spacer{flex:1}
  .tempoBox{
    display:flex;align-items:center;gap:6px;background:var(--panel);
    border:2px solid var(--line);border-radius:14px;padding:6px 8px
  }
  .tempoLabel{font-size:14px;font-weight:800;color:var(--muted)}
  button{
    font:inherit;border:0;border-radius:12px;min-height:44px;
    padding:8px 14px;font-weight:850;background:#ece8df;color:var(--ink)
  }
  button:active{transform:scale(.98)}
  button.primary{background:var(--accent);color:#fff}
  button.secondary{background:var(--accent2);color:#16434c}
  button.small{min-width:48px;padding:6px 10px}
  button.preset{font-size:14px;min-height:40px;padding:6px 10px}
  button[aria-pressed="true"]{outline:3px solid #7fb7c4;background:#cfe7ec}
  .bpm{min-width:60px;text-align:center;font-size:24px;font-weight:900}

  .main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:10px}
  .scoreCard{
    min-width:0;min-height:0;background:var(--panel);border:2px solid var(--line);
    border-radius:16px;padding:7px;display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .scoreWrap{position:relative;display:inline-block;max-width:100%;max-height:100%;overflow:hidden}
  .scoreWrap img{
    display:block;max-width:100%;max-height:100%;
    width:auto;height:auto;object-fit:contain;
  }
  .cursor{
    position:absolute;width:6px;left:10%;top:11%;height:30%;
    border-radius:3px;opacity:0;pointer-events:none;
    box-shadow:0 0 0 3px rgba(255,255,255,.88),0 0 12px rgba(0,0,0,.18);
  }
  .cursor.show{opacity:1}
  .cursor.strong{background:#d93025}
  .cursor.weak{background:#1769aa}

  .side{min-height:0;display:flex;flex-direction:column;gap:8px}
  .nowCard{
    background:var(--panel);border:2px solid var(--line);border-radius:16px;
    padding:12px;text-align:center;display:flex;flex-direction:column;
    justify-content:center;min-height:160px;flex:1;
  }
  .countdownBig{
    font-size:clamp(58px,9vw,92px);font-weight:950;line-height:1;
    color:var(--accent);min-height:1.05em;margin-bottom:2px
  }
  .nowLabel{font-size:16px;color:var(--muted);font-weight:800}
  .group{font-size:clamp(40px,5vw,58px);font-weight:950;line-height:1.05;margin-top:4px}
  .round{font-size:17px;font-weight:850;color:var(--accent);margin-top:6px}
  .instruction{font-size:18px;font-weight:850;margin-top:8px}
  .countCard{
    background:var(--panel);border:2px solid var(--line);border-radius:16px;
    padding:9px;text-align:center
  }
  .countTitle{font-size:14px;font-weight:850;color:var(--muted)}
  .dots{display:flex;justify-content:center;gap:7px;margin-top:7px}
  .dot{width:31px;height:31px;border-radius:50%;background:#ddd8cf;border:2px solid #c4beb4}
  .dot.on.strong{background:#d93025;border-color:#d93025}
  .dot.on.weak{background:#1769aa;border-color:#1769aa}
  .status{font-size:15px;min-height:22px;text-align:center;color:var(--muted);font-weight:750}

  .footer{display:flex;align-items:center;gap:8px;justify-content:center;min-height:54px}
  .soundState{font-size:14px;font-weight:750;color:var(--muted)}

  @media (max-width:900px){
    .main{grid-template-columns:minmax(0,1fr) 210px}
    .preset{display:none}
  }

  /* iPad Safari 横向き：ブラウザ上部UIがあっても操作部まで1画面 */
  @media (orientation: landscape) and (max-height:850px){
    .app{height:100dvh;min-height:0;padding:5px 9px;gap:5px;overflow:hidden}
    .topbar{min-height:42px;gap:5px}
    .title{font-size:clamp(21px,2.4vw,29px)}
    .tempoBox{padding:4px 6px}
    .main{min-height:0;gap:6px}
    .scoreCard{min-height:0;padding:4px;overflow:hidden}
    .scoreWrap{height:100%;min-height:0}
    .scoreWrap img{width:100%;height:100%;object-fit:contain;object-position:center}
    .side{min-height:0;gap:5px}
    .nowCard{padding:7px}
    .group{font-size:clamp(40px,5vw,58px)}
    .countdownBig{font-size:clamp(48px,7vw,72px);min-height:.95em}
    .footer{min-height:46px;gap:6px}
    button{min-height:38px;padding:6px 11px}
    .soundState{font-size:12px}
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="title">🎵 雨上がり</div>
    <div class="spacer"></div>
    <div class="tempoBox" aria-label="テンポ設定">

        <div class="cursor" id="cursor" aria-hidden="true"></div>
      </div>
    </section>

    <aside class="side">
      <div class="nowCard" aria-live="polite">
        <div class="countdownBig" id="countdownBig"></div>
        <div class="nowLabel">いま演奏する人</div>
        <div class="group" id="groupText">スタート前</div>
        <div class="round" id="roundText">テンポを選んでください</div>
        <div class="instruction" id="instructionText">先生はスタートを押すだけ</div>
      </div>

      <div class="countCard">
        <div class="countTitle">よびはく（2拍子 × 2小節）</div>
        <div class="dots">
          <div class="dot" id="d0"></div>
          <div class="dot" id="d1"></div>
          <div class="dot" id="d2"></div>
          <div class="dot" id="d3"></div>
        </div>
      </div>
      <div class="status" id="statusText">1列 → 2列 → 3列</div>
    </aside>
  </div>

  <div class="footer">
    <button class="primary" id="startBtn" type="button">▶ スタート</button>
    <button class="secondary" id="pauseBtn" type="button">⏸ 一時停止</button>
    <button id="resetBtn" type="button">↺ 最初から</button>
    <button id="soundBtn" type="button" aria-pressed="true">🔊 拍の音 ON</button>
    <span class="soundState">拍の音を大きめに設定（1拍目＝強、2拍目＝弱）</span>
  </div>
</div>

<script>
(() => {
  const bpmText = document.getElementById('bpmText');
  const groupText = document.getElementById('groupText');
  const roundText = document.getElementById('roundText');
  const instructionText = document.getElementById('instructionText');
  const statusText = document.getElementById('statusText');
  const countdownBig = document.getElementById('countdownBig');
  const cursor = document.getElementById('cursor');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const resetBtn = document.getElementById('resetBtn');
  const soundBtn = document.getElementById('soundBtn');
  const minusBtn = document.getElementById('minusBtn');
  const plusBtn = document.getElementById('plusBtn');
  const presets = [...document.querySelectorAll('.preset')];
  const dots = [0,1,2,3].map(i => document.getElementById('d'+i));

  let bpm = 76;
  let soundOn = true;
  let running = false;
  let paused = false;
  let phaseIndex = 0;
  let beatInPhase = 0;
  let timer = null;
  let audioCtx = null;

  const phases = [
    {group:'1列', round:'演奏', type:'play'},
    {group:'2列', round:'演奏', type:'play'},
    {group:'3列', round:'演奏', type:'play'}
  ];

  const PRECOUNT = 4;    // 2拍子×2小節
  const SONG_BEATS = 16; // 8小節×2拍
  const GAP_BEATS = 2;

  function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }

  function setBpm(v){
    bpm = clamp(Math.round(v/4)*4, 60, 120);
    bpmText.textContent = bpm;
    presets.forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.bpm)===bpm)));
    if (running && !paused) restartTimer();
  }

  function beatMs(){ return 60000 / bpm; }

  function clickSound(accent=false){
    if (!soundOn) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.frequency.value = 720; // 強弱だけを変え、音程は同じ

      // 「きれいなソラシ」より拍音を明確に大きく
      const peak = accent ? 0.34 : 0.20;

      g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(peak, audioCtx.currentTime + 0.003);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.065);
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + 0.07);
    } catch(e) {}
  }

  function clearDots(){
    dots.forEach(d => d.classList.remove('on','strong','weak'));
  }

  function positionCursor(songBeat){
    // 上段4小節＝8拍、下段4小節＝8拍
    const line = songBeat < 8 ? 0 : 1;
    const b = line === 0 ? songBeat : songBeat - 8;

    // 写真の譜面左右端の余白を避ける
    const startX = 7.5;
    const endX = 94.0;
    const x = startX + (endX-startX) * (b / 7);
    cursor.style.left = x + '%';

    if (line === 0) {
      cursor.style.top = '9%';
      cursor.style.height = '31%';
    } else {
      cursor.style.top = '56%';
      cursor.style.height = '31%';
    }

    cursor.classList.remove('strong','weak');
    cursor.classList.add(songBeat % 2 === 0 ? 'strong' : 'weak');
    cursor.classList.add('show');
  }

  function render(){
    if (!running) return;
    const p = phases[phaseIndex];
    groupText.textContent = p.group;
    roundText.textContent = p.round;

    if (beatInPhase < PRECOUNT) {
      instructionText.textContent = 'よびはくを見て じゅんび';
      statusText.textContent = '吹かない列は、音を出さずに指だけ';
      countdownBig.textContent = String(PRECOUNT - beatInPhase);
      clearDots();

      const strong = beatInPhase % 2 === 0;
      dots[beatInPhase].classList.add('on', strong ? 'strong' : 'weak');
      cursor.classList.remove('show','strong','weak');
      clickSound(strong);

    } else if (beatInPhase < PRECOUNT + SONG_BEATS) {
      instructionText.textContent = '演奏中';
      statusText.textContent = '2拍子を感じて、自分の音をよく聞こう';
      countdownBig.textContent = '';
      clearDots();

      const songBeat = beatInPhase - PRECOUNT;
      positionCursor(songBeat);
      clickSound(songBeat % 2 === 0);

    } else {
      instructionText.textContent = 'つぎの列へ';
      statusText.textContent = 'リコーダーを口からはなして、じゅんび';
      countdownBig.textContent = '';
      clearDots();
      cursor.classList.remove('show','strong','weak');
    }
  }

  function tick(){
    if (!running || paused) return;
    render();
    beatInPhase++;

    const total = PRECOUNT + SONG_BEATS + GAP_BEATS;
    if (beatInPhase >= total) {
      beatInPhase = 0;
      phaseIndex++;
      if (phaseIndex >= phases.length) finish();
    }
  }

  function restartTimer(){
    if (timer) clearInterval(timer);
    timer = setInterval(tick, beatMs());
  }

  function start(){
    if (running && paused) {
      paused = false;
      pauseBtn.textContent = '⏸ 一時停止';
      instructionText.textContent = 'つづきから';
      restartTimer();
      return;
    }
    if (running) return;

    // iPad Safariで最初のタップ時に音声を有効化
    if (soundOn) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      } catch(e) {}
    }

    running = true;
    paused = false;
    phaseIndex = 0;
    beatInPhase = 0;
    startBtn.textContent = '演奏中…';
    pauseBtn.textContent = '⏸ 一時停止';
    tick();
    restartTimer();
  }

  function pause(){
    if (!running) return;
    paused = !paused;
    if (paused) {
      if (timer) clearInterval(timer);
      timer = null;
      pauseBtn.textContent = '▶ つづき';
      instructionText.textContent = '一時停止';
      statusText.textContent = '先生の合図で再開';
      countdownBig.textContent = '';
      cursor.classList.remove('show','strong','weak');
      clearDots();
    } else {
      pauseBtn.textContent = '⏸ 一時停止';
      restartTimer();
    }
  }

  function reset(){
    if (timer) clearInterval(timer);
    timer = null;
    running = false;
    paused = false;
    phaseIndex = 0;
    beatInPhase = 0;
    groupText.textContent = 'スタート前';
    roundText.textContent = 'テンポを選んでください';
    instructionText.textContent = '先生はスタートを押すだけ';
    statusText.textContent = '1列 → 2列 → 3列';
    startBtn.textContent = '▶ スタート';
    pauseBtn.textContent = '⏸ 一時停止';
    countdownBig.textContent = '';
    cursor.classList.remove('show','strong','weak');
    clearDots();
  }

  function finish(){
    if (timer) clearInterval(timer);
    timer = null;
    running = false;
    paused = false;
    groupText.textContent = 'おしまい！';
    roundText.textContent = 'リコーダータイム';
    instructionText.textContent = '今日、きれいに出た音は？';
    statusText.textContent = '前よりできるようになったことを1つ見つけよう';
    startBtn.textContent = '▶ もう一度';
    countdownBig.textContent = '';
    cursor.classList.remove('show','strong','weak');
    clearDots();
  }

  startBtn.addEventListener('click', start);
  pauseBtn.addEventListener('click', pause);
  resetBtn.addEventListener('click', reset);
  minusBtn.addEventListener('click', () => setBpm(bpm-4));
  plusBtn.addEventListener('click', () => setBpm(bpm+4));
  presets.forEach(b => b.addEventListener('click', () => setBpm(Number(b.dataset.bpm))));
  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    soundBtn.setAttribute('aria-pressed', String(soundOn));
    soundBtn.textContent = soundOn ? '🔊 拍の音 ON' : '🔇 拍の音 OFF';
  });
})();
</script>
</body>
</html>
