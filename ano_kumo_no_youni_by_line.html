<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>リコーダータイム｜あの雲のように</title>
<style>
:root{--bg:#f7f4ec;--panel:#fff;--ink:#202020;--muted:#6d6d6d;--accent:#2d6a78;--accent2:#dfeff2;--line:#d8d3c8}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
body{touch-action:manipulation}
.app{height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:5px;padding:6px 9px}
.topbar{display:flex;align-items:center;gap:7px;min-height:42px;white-space:nowrap}
.title{font-weight:900;font-size:clamp(21px,2.5vw,30px)} .spacer{flex:1}
.tempoBox,.lineBox{display:flex;align-items:center;gap:5px;background:#fff;border:2px solid var(--line);border-radius:13px;padding:4px 6px}
.label{font-size:13px;font-weight:850;color:var(--muted)}
button{font:inherit;border:0;border-radius:10px;min-height:38px;padding:6px 10px;font-weight:850;background:#ece8df;color:var(--ink)}
button:active{transform:scale(.98)} button.primary{background:var(--accent);color:#fff} button.secondary{background:var(--accent2);color:#16434c}
button.small{min-width:42px;padding:4px 8px} button.preset{font-size:13px;min-height:34px;padding:4px 8px}
button[aria-pressed="true"]{outline:3px solid #7fb7c4;background:#cfe7ec}
.bpm{min-width:52px;text-align:center;font-size:21px;font-weight:900}

.selectrow{display:flex;align-items:center;gap:8px;min-height:42px}
.lineBox{flex:1}
.lineBtns{display:flex;gap:5px;flex-wrap:wrap}
.lineBtn{min-width:74px}
.rangeInfo{font-size:13px;color:var(--muted);font-weight:800}

.main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 225px;gap:6px}
.scoreCard{min-width:0;min-height:0;background:#fff;border:2px solid var(--line);border-radius:15px;padding:4px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.scoreWrap{position:relative;width:100%;height:100%;overflow:hidden;display:flex;align-items:center;justify-content:center}
.scoreWrap img{display:block;width:100%;height:100%;object-fit:contain}
.cursor{position:absolute;width:6px;top:12%;height:72%;border-radius:3px;opacity:0;pointer-events:none;
box-shadow:0 0 0 3px rgba(255,255,255,.88),0 0 12px rgba(0,0,0,.18)}
.cursor.show{opacity:1} .cursor.strong{background:#d93025} .cursor.weak{background:#1769aa}

.side{min-height:0;display:flex;flex-direction:column;gap:4px}
.nowCard{background:#fff;border:2px solid var(--line);border-radius:15px;padding:6px;text-align:center;display:flex;flex-direction:column;justify-content:center;min-height:112px;flex:1}
.countdownBig{font-size:clamp(38px,5.5vw,58px);font-weight:950;line-height:1;color:var(--accent);min-height:.9em}
.nowLabel{font-size:13px;color:var(--muted);font-weight:800}
.group{font-size:clamp(35px,4.5vw,50px);font-weight:950;line-height:1.05;margin-top:2px}
.round{font-size:14px;font-weight:850;color:var(--accent);margin-top:3px}
.instruction{font-size:15px;font-weight:850;margin-top:4px}

.countCard{background:#fff;border:2px solid var(--line);border-radius:15px;padding:6px;text-align:center}
.countTitle{font-size:12px;font-weight:850;color:var(--muted)}
.dots{display:grid;grid-template-columns:repeat(3,28px);grid-template-rows:repeat(2,28px);justify-content:center;gap:5px 7px;margin-top:5px}
.dot{width:28px;height:28px;border-radius:50%;background:#ddd8cf;border:2px solid #c4beb4}
.dot.on.strong{background:#d93025;border-color:#d93025} .dot.on.weak{background:#1769aa;border-color:#1769aa}
.status{font-size:12px;min-height:18px;text-align:center;color:var(--muted);font-weight:750}

.footer{display:flex;align-items:center;gap:6px;justify-content:center;min-height:42px}
.soundState{font-size:11px;font-weight:750;color:var(--muted)}

@media (orientation:landscape) and (max-height:850px){
 .app{height:100dvh;padding:4px 7px;gap:4px}
 .topbar,.selectrow{min-height:36px}
 .title{font-size:clamp(19px,2.2vw,26px)}
 button{min-height:34px;padding:4px 8px}
 .main{grid-template-columns:minmax(0,1fr) 205px}
 .group{font-size:clamp(33px,4vw,46px)}
 .footer{min-height:38px}
}
@media (max-width:900px){.preset{display:none}}
</style>
</head>
<body>
<div class="app">
 <div class="topbar">
  <div class="title">🎵 あの雲のように</div><div class="spacer"></div>
  <div class="tempoBox">
   <span class="label">テンポ</span>
   <button class="small" id="minusBtn">−</button><span class="bpm" id="bpmText">60</span><button class="small" id="plusBtn">＋</button>
   <button class="preset" data-bpm="52">ゆっくり 52</button>
   <button class="preset" data-bpm="58">58</button>
   <button class="preset" data-bpm="60" aria-pressed="true">60</button>
   <button class="preset" data-bpm="63">楽譜 63</button>
  </div>
 </div>

 <div class="selectrow">
  <div class="lineBox">
   <span class="label">練習する段（複数選択）</span>
   <div class="lineBtns">
    <button class="lineBtn" data-line="0" aria-pressed="true">1段目</button>
    <button class="lineBtn" data-line="1" aria-pressed="false">2段目</button>
    <button class="lineBtn" data-line="2" aria-pressed="false">3段目</button>
    <button class="lineBtn" data-line="3" aria-pressed="false">4段目</button>
   </div>
   <span class="rangeInfo" id="rangeInfo">1段目を練習</span>
  </div>
 </div>

 function beatMs(){return 60000/bpm}
 function ensureAudio(){
   try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}
 }
 function clickSound(strong){
   if(!soundOn)return;ensureAudio();if(!audioCtx)return;
   const o=audioCtx.createOscillator(),g=audioCtx.createGain();
   o.frequency.value=720;
   const peak=strong?0.36:0.21;
   g.gain.setValueAtTime(0.0001,audioCtx.currentTime);
   g.gain.exponentialRampToValueAtTime(peak,audioCtx.currentTime+0.003);
   g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+0.07);
   o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+0.075);
 }
 function clearDots(){dots.forEach(d=>d.classList.remove('on','strong','weak'))}
 function lightPre(i){clearDots();dots[i].classList.add('on',i%3===0?'strong':'weak')}
 function showLine(line){scoreImg.src=ASSETS[line]}
 function positionCursor(localBeat){
   const x=7+(localBeat/(BEATS_PER_LINE-1))*87;
   cursor.style.left=x+'%';
   cursor.classList.remove('strong','weak');
   cursor.classList.add(localBeat%3===0?'strong':'weak','show');
 }
 function render(){
   if(!running)return;
   const arr=orderedSelected();
   groupText.textContent=groups[groupIndex];

   if(beat<PRE){
     countdownBig.textContent=PRE-beat;
     roundText.textContent='よびはく';
     instructionText.textContent='3拍子にのって じゅんび';
     statusText.textContent='🔴・🔵・🔵｜🔴・🔵・🔵';
     lightPre(beat);
     cursor.classList.remove('show','strong','weak');
     clickSound(beat%3===0);
     showLine(arr[0]);
   }else if(beat<PRE+BEATS_PER_LINE*arr.length){
     countdownBig.textContent='';
     roundText.textContent='演奏';
     instructionText.textContent=selectedLabel()+'をつづけて演奏';
     statusText.textContent='吹かない列は、音を出さずに指だけ';
     clearDots();

     const songBeat=beat-PRE;
     const wantedPos=Math.floor(songBeat/BEATS_PER_LINE);
     const local=songBeat%BEATS_PER_LINE;
     if(wantedPos!==currentSelectedPos){
       currentSelectedPos=wantedPos;
       showLine(arr[currentSelectedPos]);
     }
     positionCursor(local);
     clickSound(songBeat%3===0);

   }else{
     countdownBig.textContent='';
     roundText.textContent='交代';
     instructionText.textContent='つぎの列へ';
     statusText.textContent='リコーダーを口からはなして準備';
     clearDots();cursor.classList.remove('show','strong','weak');
   }
 }
 function tick(){
   if(!running||paused)return;
   render();beat++;
   const total=PRE+BEATS_PER_LINE*orderedSelected().length+GAP;
   if(beat>=total){
     beat=0;currentSelectedPos=0;groupIndex++;
     if(groupIndex>=groups.length)finish();
     else showLine(orderedSelected()[0]);
   }
 }
 function restartTimer(){if(timer)clearInterval(timer);timer=setInterval(tick,beatMs())}
 function lockSettings(lock){
   lineBtns.forEach(b=>b.disabled=lock);
   presets.forEach(b=>b.disabled=lock);
   minusBtn.disabled=lock;plusBtn.disabled=lock;
 }
 function start(){
   if(running&&paused){paused=false;pauseBtn.textContent='⏸ 一時停止';restartTimer();return}
   if(running)return;
   ensureAudio();running=true;paused=false;groupIndex=0;beat=0;currentSelectedPos=0;
   lockSettings(true);showLine(orderedSelected()[0]);
   startBtn.textContent='演奏中…';pauseBtn.textContent='⏸ 一時停止';
   tick();restartTimer();
 }
 function pause(){
   if(!running)return;paused=!paused;
   if(paused){
     if(timer)clearInterval(timer);timer=null;pauseBtn.textContent='▶ つづき';
     instructionText.textContent='一時停止';countdownBig.textContent='';clearDots();cursor.classList.remove('show','strong','weak');
   }else{pauseBtn.textContent='⏸ 一時停止';restartTimer()}
 }
 function reset(){
   if(timer)clearInterval(timer);timer=null;running=false;paused=false;groupIndex=0;beat=0;currentSelectedPos=0;lockSettings(false);
   groupText.textContent='スタート前';roundText.textContent='段を選んでください';instructionText.textContent='先生はスタートを押すだけ';
   statusText.textContent='1列 → 2列 → 3列';countdownBig.textContent='';startBtn.textContent='▶ スタート';pauseBtn.textContent='⏸ 一時停止';
   clearDots();cursor.classList.remove('show','strong','weak');showLine(orderedSelected()[0]);
 }
 function finish(){
   if(timer)clearInterval(timer);timer=null;running=false;paused=false;lockSettings(false);
   groupText.textContent='おしまい！';roundText.textContent='リコーダータイム';instructionText.textContent='今日、きれいに出た音は？';
   statusText.textContent='前よりできるようになったことを1つ見つけよう';startBtn.textContent='▶ もう一度';
   countdownBig.textContent='';clearDots();cursor.classList.remove('show','strong','weak');
 }
 lineBtns.forEach(btn=>btn.onclick=()=>{
   if(running)return;
   const line=Number(btn.dataset.line);
   if(selected.has(line)){
     if(selected.size===1)return;
     selected.delete(line);
   }else selected.add(line);
   lineBtns.forEach(b=>b.setAttribute('aria-pressed',String(selected.has(Number(b.dataset.line)))));
   updateRangeInfo();showLine(orderedSelected()[0]);
 });
 startBtn.onclick=start;pauseBtn.onclick=pause;resetBtn.onclick=reset;
 minusBtn.onclick=()=>setBpm(bpm-1);plusBtn.onclick=()=>setBpm(bpm+1);
 presets.forEach(b=>b.onclick=()=>setBpm(Number(b.dataset.bpm)));
 soundBtn.onclick=()=>{soundOn=!soundOn;soundBtn.setAttribute('aria-pressed',String(soundOn));soundBtn.textContent=soundOn?'🔊 拍の音 ON':'🔇 拍の音 OFF';if(soundOn)ensureAudio()};
 updateRangeInfo();
})();
</script>
</body>
</html>
