<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>リコーダータイム 2分30秒</title>
<style>
  :root{
    --bg:#f7f4ec; --panel:#ffffff; --ink:#202020; --muted:#6d6d6d;
    --accent:#2d6a78; --accent2:#dfeff2; --line:#d8d3c8;
    --red:#d93025; --blue:#1769aa;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
  body{touch-action:manipulation}
  .app{height:100dvh;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:5px;padding:5px 9px}
  .topbar{display:flex;align-items:center;gap:10px;min-height:42px}
  .title{font-size:clamp(22px,3vw,34px);font-weight:900;white-space:nowrap}
  .spacer{flex:1}
  .progressText{font-size:18px;font-weight:800;color:var(--muted)}
  .main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:10px}
  .practiceCard{min-width:0;min-height:0;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:8px;
    display:grid;grid-template-rows:auto auto 1fr auto;align-items:center;text-align:center}
  .noteLabel{font-size:clamp(22px,3vw,30px);font-weight:800;color:var(--muted)}
  .noteName{font-size:clamp(72px,13vw,150px);line-height:1;font-weight:950;margin-top:2px}
  .team{font-size:clamp(36px,6vw,66px);font-weight:950;margin:4px 0 2px}
  .countdown{min-height:1.1em;font-size:clamp(70px,12vw,130px);line-height:1;font-weight:950;color:var(--accent)}
  .rhythmWrap{display:flex;justify-content:center;gap:18px;align-items:end;min-height:78px;padding:8px 6px 0}
  .beat{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:58px}
  .barSep{width:3px;height:76px;background:var(--line);border-radius:2px;align-self:center}
  .beatDot{width:32px;height:32px;border-radius:50%;background:#d9d6cf;border:3px solid #c8c3b8;transition:.08s}
  .beatDot.active.strong{background:var(--red);border-color:var(--red);transform:scale(1.12)}
  .beatDot.active.weak{background:var(--blue);border-color:var(--blue);transform:scale(1.08)}
  .dur{font-size:18px;font-weight:900;color:var(--muted)}
  .hint{font-size:18px;font-weight:800;color:var(--muted);margin-top:6px}
  .side{min-height:0;display:flex;flex-direction:column;gap:5px}
  .panel{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px;text-align:center}
  .sideTitle{font-size:15px;font-weight:800;color:var(--muted)}
  .sideBig{font-size:28px;font-weight:950;margin-top:6px}
  .sideText{font-size:18px;font-weight:800;line-height:1.5;margin-top:4px}
  .sequence{font-size:18px;font-weight:900;line-height:1.7}
  .current{color:var(--accent);text-decoration:underline;text-underline-offset:4px}
  button{font:inherit;border:0;border-radius:12px;min-height:36px;padding:8px 14px;font-weight:850;background:#ece8df;color:var(--ink)}
  button:active{transform:scale(.98)}
  button.primary{background:var(--accent);color:white}
  button.secondary{background:var(--accent2);color:#16434c}
  .footer{min-height:42px;display:flex;gap:5px;align-items:center;justify-content:center;flex-wrap:wrap}
  .status{font-size:14px;font-weight:700;color:var(--muted)}
  @media (max-width:900px){.main{grid-template-columns:minmax(0,1fr) 220px}.sideText,.sequence{font-size:16px}}

  /* iPad Safari 横向き：ブラウザUI込みで1画面に収める */
  @media (orientation: landscape) and (max-height: 850px){
    .app{
      height:100dvh;
      min-height:0;
      padding:4px 8px;
      gap:4px;
      overflow:hidden;
    }
    .topbar{
      min-height:38px;
      gap:5px;
    }
    .title{
      font-size:clamp(20px,2.2vw,28px);
    }
    .progressText{
      font-size:14px;
    }
    .main{
      min-height:0;
      grid-template-columns:minmax(0,1fr) 220px;
      gap:5px;
      overflow:hidden;
    }
    .practiceCard{
      min-height:0;
      padding:5px 8px;
      grid-template-rows:auto auto minmax(0,1fr) auto;
      overflow:hidden;
    }
    .noteLabel{
      font-size:16px;
    }
    .noteName{
      font-size:clamp(56px,8vw,92px);
      line-height:.95;
      margin-top:0;
    }
    .team{
      font-size:clamp(28px,4vw,46px);
      margin:0;
      line-height:1;
    }
    .countdown{
      min-height:.9em;
      font-size:clamp(52px,7vw,78px);
      line-height:.9;
    }
    .rhythmWrap{
      min-height:64px;
      gap:10px;
      padding:2px 4px 0;
    }
    .beat{
      min-width:42px;
      gap:4px;
    }
    .beatDot{
      width:28px;
      height:28px;
      border-width:2px;
    }
    .barSep{
      height:52px;
    }
    .dur{
      font-size:14px;
    }
    .hint{
      font-size:14px;
      margin-top:2px;
    }
    .side{
      min-height:0;
      gap:4px;
      overflow:hidden;
    }
    .panel{
      padding:7px;
      border-radius:12px;
    }
    .sideTitle{
      font-size:12px;
    }
    .sideBig{
      font-size:21px;
      margin-top:3px;
    }
    .sideText,.sequence{
      font-size:13px;
      line-height:1.35;
    }
    .footer{
      min-height:38px;
      gap:5px;
      flex-wrap:nowrap;
      overflow:hidden;
    }
    button{
      min-height:32px;
      padding:4px 9px;
      font-size:13px;
      white-space:nowrap;
    }
    .status{
      font-size:11px;
      white-space:nowrap;
    }
  }

</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="title">🎵 リコーダータイム</div>
    <div class="spacer"></div>
    <div class="progressText" id="progressText">スタート前</div>
  </div>

  <div class="main">
    <section class="practiceCard">
      <div>
        <div class="noteLabel">きょうの音</div>
        <div class="noteName" id="noteName">シ</div>
      </div>

      <div class="team" id="teamText">Aチーム</div>

      <div>
        <div class="countdown" id="countdown"></div>
        <div class="rhythmWrap" aria-label="タン タン ターン タン タン ターン">
          <div class="beat"><div class="beatDot" id="b0"></div><div class="dur">タン</div></div>
          <div class="beat"><div class="beatDot" id="b1"></div><div class="dur">タン</div></div>
          <div class="beat"><div class="beatDot" id="b2"></div><div class="dur">ターン</div></div>
          <div class="beat"><div class="beatDot" id="b3"></div><div class="dur">・</div></div>
          <div class="barSep" aria-hidden="true"></div>
          <div class="beat"><div class="beatDot" id="b4"></div><div class="dur">タン</div></div>
          <div class="beat"><div class="beatDot" id="b5"></div><div class="dur">タン</div></div>
          <div class="beat"><div class="beatDot" id="b6"></div><div class="dur">ターン</div></div>
          <div class="beat"><div class="beatDot" id="b7"></div><div class="dur">・</div></div>
        </div>
      </div>

      <div class="hint" id="hintText">吹かないチームは、音を出さずに指だけ</div>
    </section>

    <aside class="side">
      <div class="panel">
        <div class="sideTitle">れんしゅうのじゅんばん</div>
        <div class="sequence" id="sequenceText"><span class="current">シ</span> → ラ → ソ → 高いド → 高いレ</div>
      </div>
      <div class="panel">
        <div class="sideTitle">いま</div>
        <div class="sideBig" id="sideNow">シ・Aチーム</div>
        <div class="sideText">4 → 3 → 2 → 1<br>タン・タン・ターン｜タン・タン・ターン</div>
      </div>
      <div class="panel">
        <div class="sideTitle">拍の合図</div>
        <div class="sideText">1拍目：<b style="color:#d93025">赤＋強</b><br>2〜4拍目：<b style="color:#1769aa">青＋弱</b></div>
      </div>
    </aside>
  </div>

  <div class="footer">
    <button class="primary" id="startBtn" type="button">▶ スタート</button>
    <button class="secondary" id="pauseBtn" type="button">⏸ 一時停止</button>
    <button id="resetBtn" type="button">↺ 最初から</button>

    <button id="tempoDownBtn" type="button">−</button>
    <span class="status" id="tempoLabel">♩ = 75</span>
    <button id="tempoUpBtn" type="button">＋</button>

    <button id="soundBtn" type="button" aria-pressed="true">🔊 拍の音 ON</button>
    <span class="status">同じ高さの音で、強・弱・弱・弱</span>
  </div>
</div>

<script>
(() => {
  const notes = ['シ','ラ','ソ','高いド','高いレ'];
  const teams = ['Aチーム','Bチーム'];

  const noteName = document.getElementById('noteName');
  const teamText = document.getElementById('teamText');
  const countdown = document.getElementById('countdown');
  const progressText = document.getElementById('progressText');
  const sequenceText = document.getElementById('sequenceText');
  const sideNow = document.getElementById('sideNow');
  const hintText = document.getElementById('hintText');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const resetBtn = document.getElementById('resetBtn');
  const soundBtn = document.getElementById('soundBtn');
  const tempoDownBtn = document.getElementById('tempoDownBtn');
  const tempoUpBtn = document.getElementById('tempoUpBtn');
  const tempoLabel = document.getElementById('tempoLabel');
  const beatDots = Array.from({length:8},(_,i)=>document.getElementById('b'+i));

  let running=false, paused=false, soundOn=true;
  let noteIndex=0, teamIndex=0, stage='countdown', step=0;
  let timer=null, audioCtx=null;

  let tempo=75;
  const COUNT_BEATS=4, PLAY_BEATS=8, GAP_BEATS=3;
  function beatMs(){ return 60000/tempo; }

  function clearBeatDots(){beatDots.forEach(d=>d.className='beatDot')}

  function clickSound(accent=false){
    if(!soundOn) return;
    try{
      if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      if(audioCtx.state==='suspended') audioCtx.resume();
      const o=audioCtx.createOscillator();
      const g=audioCtx.createGain();
      o.frequency.value=720;
      const peak=accent?0.16:0.055;
      g.gain.setValueAtTime(0.0001,audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(peak,audioCtx.currentTime+0.003);
      g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+0.04);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime+0.045);
    }catch(e){}
  }

  function renderSequence(){
    sequenceText.innerHTML=notes.map((n,i)=>i===noteIndex?`<span class="current">${n}</span>`:n).join(' → ');
  }

  function renderHeader(){
    const n=notes[noteIndex], t=teams[teamIndex];
    noteName.textContent=n;
    teamText.textContent=t;
    sideNow.textContent=`${n}・${t}`;
    progressText.textContent=`${noteIndex+1}/5　${t}`;
    renderSequence();
  }

  function render(){
    renderHeader();
    clearBeatDots();

    if(stage==='countdown'){
      countdown.textContent=String(COUNT_BEATS-step);
      hintText.textContent='吹かないチームは、音を出さずに指だけ';
      clickSound(step===0);
    }else if(stage==='play'){
      countdown.textContent='';
      const beat=step, strong=beat%4===0;
      beatDots[beat].classList.add('active',strong?'strong':'weak');
      clickSound(strong);
      hintText.textContent='タン・タン・ターン｜タン・タン・ターン';
    }else{
      countdown.textContent='';
      hintText.textContent='つぎのチームへ じゅんび';
    }
  }

  function advance(){
    if(stage==='countdown'){
      step++;
      if(step>=COUNT_BEATS){stage='play';step=0}
    }else if(stage==='play'){
      step++;
      if(step>=PLAY_BEATS){stage='gap';step=0}
    }else{
      step++;
      if(step>=GAP_BEATS){
        step=0;stage='countdown';teamIndex++;
        if(teamIndex>=teams.length){
          teamIndex=0;noteIndex++;
          if(noteIndex>=notes.length){finish();return}
        }
      }
    }
  }

  function tick(){if(!running||paused)return;render();advance()}
  function startTimer(){if(timer)clearInterval(timer);timer=setInterval(tick,beatMs())}

  function start(){
    if(running&&paused){paused=false;pauseBtn.textContent='⏸ 一時停止';startTimer();return}
    if(running)return;
    running=true;paused=false;noteIndex=0;teamIndex=0;stage='countdown';step=0;
    startBtn.textContent='進行中…';tick();startTimer();
  }

  function pause(){
    if(!running)return;
    paused=!paused;
    if(paused){
      if(timer)clearInterval(timer);timer=null;
      pauseBtn.textContent='▶ つづき';
      countdown.textContent='';hintText.textContent='一時停止';clearBeatDots();
    }else{
      pauseBtn.textContent='⏸ 一時停止';startTimer();
    }
  }

  function reset(){
    if(timer)clearInterval(timer);
    timer=null;running=false;paused=false;noteIndex=0;teamIndex=0;stage='countdown';step=0;
    noteName.textContent='シ';teamText.textContent='Aチーム';countdown.textContent='';
    progressText.textContent='スタート前';sideNow.textContent='シ・Aチーム';
    hintText.textContent='吹かないチームは、音を出さずに指だけ';
    sequenceText.innerHTML='<span class="current">シ</span> → ラ → ソ → 高いド → 高いレ';
    startBtn.textContent='▶ スタート';pauseBtn.textContent='⏸ 一時停止';clearBeatDots();
  }

  function finish(){
    if(timer)clearInterval(timer);
    timer=null;running=false;paused=false;countdown.textContent='';clearBeatDots();
    noteName.textContent='できた！';teamText.textContent='つぎは曲タイム';
    progressText.textContent='前半おわり';sideNow.textContent='基礎練習 おわり';
    hintText.textContent='リコーダーを口からはなして、曲の準備';
    startBtn.textContent='▶ もう一度';
  }

  startBtn.addEventListener('click',start);
  pauseBtn.addEventListener('click',pause);
  resetBtn.addEventListener('click',reset);
  soundBtn.addEventListener('click',()=>{
    soundOn=!soundOn;
    soundBtn.setAttribute('aria-pressed',String(soundOn));
    soundBtn.textContent=soundOn?'🔊 拍の音 ON':'🔇 拍の音 OFF';
  });


  function updateTempo(delta){
    tempo = Math.max(60, Math.min(120, tempo + delta));
    tempoLabel.textContent = `♩ = ${tempo}`;
    if(running && !paused){
      startTimer();
    }
  }

  tempoDownBtn.addEventListener('click',()=>updateTempo(-5));
  tempoUpBtn.addEventListener('click',()=>updateTempo(5));

  reset();
})();
</script>
</body>
</html>
