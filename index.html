<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>音楽教材</title>
<style>
  :root{
    --bg:#f7f4ec;
    --panel:#ffffff;
    --ink:#202020;
    --muted:#6d6d6d;
    --accent:#2d6a78;
    --accent-soft:#dfeff2;
    --line:#d8d3c8;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  }
  body{touch-action:manipulation}
  .app{
    height:100svh;
    min-height:100vh;
    display:grid;
    grid-template-rows:auto 1fr auto;
    padding:14px 18px;
    gap:14px;
  }
  header{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .icon{
    width:64px;height:64px;
    border-radius:18px;
    display:grid;place-items:center;
    background:var(--accent);
    color:white;
    font-size:34px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
  }
  h1{
    margin:0;
    font-size:clamp(30px,4vw,48px);
    line-height:1.05;
  }
  .sub{
    margin-top:5px;
    font-size:clamp(15px,2vw,20px);
    font-weight:700;
    color:var(--muted);
  }
  main{
    min-height:0;
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:16px;
  }
  .card{
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    text-decoration:none;
    color:inherit;
    background:var(--panel);
    border:2px solid var(--line);
    border-radius:22px;
    padding:24px;
    box-shadow:0 5px 16px rgba(0,0,0,.05);
    transition:transform .08s, box-shadow .08s, border-color .08s;
    min-height:0;
  }
  .card:active{
    transform:scale(.985);
    border-color:var(--accent);
    box-shadow:0 2px 8px rgba(0,0,0,.08);
  }
  .cardTop{
    display:flex;
    align-items:center;
    gap:16px;
  }
  .cardIcon{
    width:72px;height:72px;
    border-radius:20px;
    display:grid;place-items:center;
    background:var(--accent-soft);
    font-size:38px;
    flex:0 0 auto;
  }
  .cardTitle{
    font-size:clamp(26px,3.4vw,40px);
    font-weight:950;
    line-height:1.12;
  }
  .desc{
    margin-top:18px;
    font-size:clamp(16px,2vw,22px);
    font-weight:700;
    line-height:1.5;
    color:var(--muted);
  }
  .go{
    margin-top:18px;
    align-self:flex-end;
    padding:10px 18px;
    border-radius:999px;
    background:var(--accent);
    color:#fff;
    font-size:18px;
    font-weight:900;
  }
  footer{
    text-align:center;
    color:var(--muted);
    font-size:14px;
    font-weight:700;
  }
  @media (max-width:800px){
    .app{padding:10px 12px;gap:10px}
    .icon{width:54px;height:54px;font-size:30px}
    main{gap:10px}
    .card{padding:16px}
    .cardIcon{width:58px;height:58px;font-size:32px}
    .desc{margin-top:10px}
    .go{margin-top:10px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="icon">🎵</div>
    <div>
      <h1>音楽教材</h1>
      <div class="sub">使いたい教材をタップしてください</div>
    </div>
  </header>

  <main>
    <a class="card" href="recorder/basic.html">
      <div>
        <div class="cardTop">
          <div class="cardIcon">🪈</div>
          <div class="cardTitle">リコーダー<br>基礎練習</div>
        </div>
        <div class="desc">
          シ・ラ・ソ・高いド・高いレを、A/Bチームに分かれて練習します。
        </div>
      </div>
      <div class="go">ひらく →</div>
    </a>

    <a class="card" href="recorder/sorashi.html">
      <div>
        <div class="cardTop">
          <div class="cardIcon">🎼</div>
          <div class="cardTitle">きれいなソラシ</div>
        </div>
        <div class="desc">
          楽譜を見ながら、列ごとに演奏します。速さも調整できます。
        </div>
      </div>
      <div class="go">ひらく →</div>
    </a>
  </main>

  <footer>音楽教材トップ</footer>
</div>
</body>
</html>
