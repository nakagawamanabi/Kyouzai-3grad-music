<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>3年生 音楽教材</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0;
    min-height:100%;
    background:#f4f6f8;
    color:#17202a;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  }
  body{padding:18px}
  .wrap{max-width:1050px;margin:0 auto}
  h1{
    margin:0 0 6px;
    font-size:clamp(28px,4vw,44px);
    letter-spacing:.02em;
  }
  .sub{
    margin:0 0 20px;
    color:#68727d;
    font-size:15px;
    font-weight:700;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:16px;
  }
  .card{
    display:flex;
    flex-direction:column;
    min-height:210px;
    padding:20px;
    background:#fff;
    border:1px solid #d9dde4;
    border-radius:18px;
    text-decoration:none;
    color:inherit;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
  }
  .icon{
    font-size:42px;
    line-height:1;
    margin-bottom:16px;
  }
  .title{
    font-size:24px;
    font-weight:900;
    margin-bottom:8px;
  }
  .desc{
    color:#66707b;
    font-size:14px;
    line-height:1.6;
    font-weight:700;
  }
  .go{
    margin-top:auto;
    padding-top:18px;
    color:#1f4b7a;
    font-weight:900;
  }
  @media(max-width:760px){
    .grid{grid-template-columns:1fr}
    .card{min-height:150px}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>3年生 音楽教材</h1>
  <p class="sub">授業で使う練習ツールを選びます。</p>

  <div class="grid">
    <a class="card" href="basic.html">
      <div class="icon">🎵</div>
      <div class="title">リコーダー基礎練習</div>
      <div class="desc">シ・ラ・ソ・高いド・高いレを、A・Bチームで順番に練習します。</div>
      <div class="go">開く →</div>
    </a>

    <a class="card" href="sorashi.html">
      <div class="icon">🎼</div>
      <div class="title">きれいなソラシ</div>
      <div class="desc">1列・2列・3列に分かれて、テンポに合わせて練習します。</div>
      <div class="go">開く →</div>
    </a>

    <a class="card" href="yukaina_mokkin.html">
      <div class="icon">🪵</div>
      <div class="title">ゆかいな木きん</div>
      <div class="desc">4小節ごとに区間とパートを選び、選んだ範囲を列ごとに連続して練習します。</div>
      <div class="go">開く →</div>
    </a>
  </div>
</div>
</body>
</html>
