<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>リズムをつくろう</title>
<style>
:root{
  --bg:#fffdf7; --ink:#202020; --line:#d7d1c5; --panel:#fff;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink);background:var(--bg)}
body{padding:10px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:8px;max-width:1200px;margin:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:clamp(22px,3vw,36px);margin:0}
.note{font-size:clamp(13px,1.6vw,18px);font-weight:700}
.score{
  background:var(--panel);border:2px solid var(--ink);border-radius:16px;padding:10px;
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;min-height:0
}
.measure{
  position:relative;border-right:3px solid var(--ink);display:grid;grid-template-columns:repeat(4,1fr);
  align-items:center;min-width:0;padding:26px 5px 5px
}
.measure:first-child{border-left:3px solid var(--ink)}
.num{position:absolute;top:3px;left:8px;font-size:15px;font-weight:800}
.beat{
  height:75%;min-height:72px;display:flex;align-items:center;justify-content:center;
  border-bottom:2px solid #ddd;font-weight:800;font-size:clamp(20px,2.6vw,35px);white-space:nowrap
}
.beat.empty::after{content:"・";color:#c8c8c8;font-size:28px}
.beat.active{outline:3px solid #777;outline-offset:-3px;border-radius:10px}
.controls{display:grid;grid-template-columns:1.2fr 1fr;gap:8px}
.materials,.actions{display:grid;gap:8px}
.materials{grid-template-columns:repeat(3,1fr)}
.actions{grid-template-columns:repeat(4,1fr)}
button{
  border:2px solid var(--ink);border-radius:14px;background:white;color:var(--ink);
  font-weight:800;min-height:68px;padding:5px;font-size:clamp(15px,1.8vw,22px);
  touch-action:manipulation
}
button:active{transform:scale(.98);background:#eee}
.material{font-size:clamp(18px,2.1vw,27px)}
.symbol{display:block;font-size:clamp(27px,3vw,42px);line-height:1}
.rest-img{display:block;height:clamp(31px,3.4vw,48px);width:auto;margin:0 auto;object-fit:contain}
.beat .rest-img{height:clamp(31px,3.2vw,45px)}
.small{display:block;font-size:12px;font-weight:600;margin-top:3px}
button:disabled{opacity:.35}
@media(max-height:600px){
 body{padding:6px}.app{gap:5px}.score{padding:6px}.beat{min-height:55px}
 button{min-height:55px} h1{font-size:22px}
}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>リズムをつくろう</h1>
  <div class="note">🔈 きくときは、耳もとで小さくきこう</div>
</header>

function add(kind){
  if(filled()>=16)return;
  snapshot();
  const i=score.findIndex(m=>m.length<4);
  if(i>=0) score[i].push(kind);
  render();
}
document.querySelectorAll(".material").forEach(b=>b.onclick=()=>add(b.dataset.kind));

document.getElementById("undo").onclick=()=>{
  if(!history.length)return;
  const old=JSON.parse(history.pop());
  for(let i=0;i<4;i++){score[i].length=0;score[i].push(...old[i]);}
  render();
};
document.getElementById("clear").onclick=()=>{
  snapshot(); score.forEach(m=>m.length=0); render();
};
document.getElementById("repeat").onclick=()=>{
  const i=currentMeasure();
  if(score[i].length!==4 || i>=3)return;
  snapshot(); score[i+1].push(...score[i]); render();
};

function ctx(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}
function clickSound(t,accent=false){
  const c=ctx(), o=c.createOscillator(), g=c.createGain();
  o.type="sine"; o.frequency.value=accent?660:520;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.035,t+0.005); // intentionally quiet
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.07);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+0.08);
}
document.getElementById("play").onclick=async()=>{
  if(playing||filled()===0)return;
  const c=ctx(); if(c.state==="suspended") await c.resume();
  playing=true;render();
  const beatMs=520, events=[];
  score.forEach((m,mi)=>m.forEach((kind,bi)=>events.push({kind,pos:mi*4+bi})));
  const start=c.currentTime+.08;
  events.forEach((e,j)=>{
    const t=start+j*beatMs/1000;
    if(e.kind==="tan") clickSound(t,j%4===0);
    if(e.kind==="tata"){clickSound(t,j%4===0);clickSound(t+beatMs/2000,false);}
    setTimeout(()=>render(e.pos),Math.max(0,(t-c.currentTime)*1000));
  });
  const end=events.length*beatMs+150;
  setTimeout(()=>{playing=false;render();},end);
};
render();
</script>
</body>
</html>
