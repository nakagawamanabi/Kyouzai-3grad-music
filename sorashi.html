<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>リコーダータイム｜きれいなソラシ</title>
<style>
  :root {
    --bg:#f7f4ec;
    --panel:#ffffff;
    --ink:#202020;
    --muted:#6d6d6d;
    --accent:#2d6a78;
    --accent2:#dfeff2;
    --warn:#b45f06;
    --line:#d8d3c8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;}
  body{touch-action:manipulation}
  .app{height:100svh;min-height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;padding:10px 12px 10px;}
  .topbar{display:flex;align-items:center;gap:6px;min-height:58px;flex-wrap:nowrap}
  .title{font-weight:800;font-size:clamp(22px,3vw,34px);white-space:nowrap}
  .spacer{flex:1}
  .tempoBox{display:flex;align-items:center;gap:6px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:6px 8px}
  .tempoLabel{font-size:14px;font-weight:700;color:var(--muted);margin-right:2px}
  button{font:inherit;border:0;border-radius:12px;min-height:44px;padding:8px 14px;font-weight:800;background:#ece8df;color:var(--ink)}
  button:active{transform:scale(.98)}
  button.primary{background:var(--accent);color:#fff}
  button.secondary{background:var(--accent2);color:#16434c}
  button.small{min-width:48px;padding:6px 10px}
  button.preset{font-size:14px;min-height:40px;padding:6px 10px}
  button[aria-pressed="true"]{outline:3px solid #7fb7c4;background:#cfe7ec}
  .bpm{min-width:66px;text-align:center;font-size:24px;font-weight:900}
  .main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:10px}
  .scoreCard{min-width:0;min-height:0;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:8px;display:flex;align-items:center;justify-content:center}
  .scoreWrap{position:relative;display:inline-block;max-width:100%;max-height:100%;overflow:hidden}
  .scoreWrap img{display:block;max-width:100%;max-height:calc(100svh - 170px);width:auto;height:auto;object-fit:contain}
  .cursor{position:absolute;width:5px;background:#e33;top:26%;height:21%;left:10%;border-radius:3px;box-shadow:0 0 0 3px rgba(255,255,255,.85),0 0 12px rgba(227,51,51,.55);opacity:0;pointer-events:none}
  .cursor.show{opacity:1}
  .cursor.strong{background:#d93025;box-shadow:0 0 0 3px rgba(255,255,255,.9),0 0 12px rgba(217,48,37,.55)}
  .cursor.weak{background:#1769aa;box-shadow:0 0 0 3px rgba(255,255,255,.9),0 0 12px rgba(23,105,170,.45)}
  .countdownBig{font-size:clamp(56px,9vw,92px);font-weight:950;line-height:1;color:var(--accent);min-height:1.05em;margin-bottom:2px}
  .side{min-height:0;display:flex;flex-direction:column;gap:8px}
  .nowCard{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px;text-align:center;display:flex;flex-direction:column;justify-content:center;min-height:160px}
  .nowLabel{font-size:16px;color:var(--muted);font-weight:800}
  .group{font-size:clamp(34px,5vw,54px);font-weight:900;line-height:1.1;margin-top:4px}
  .round{font-size:17px;font-weight:800;color:var(--accent);margin-top:6px}
  .instruction{font-size:18px;font-weight:800;margin-top:8px}
  .countCard{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:10px;text-align:center}
  .countTitle{font-size:14px;font-weight:800;color:var(--muted)}
  .dots{display:flex;justify-content:center;gap:6px;margin-top:8px}
  .dot{width:30px;height:30px;border-radius:50%;background:#ddd8cf;border:2px solid #c4beb4}
  .dot.on{background:var(--accent);border-color:var(--accent)}
  .status{font-size:15px;min-height:22px;text-align:center;color:var(--muted);font-weight:700}
  .controls{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
  .footer{display:flex;align-items:center;gap:8px;justify-content:center;min-height:54px}
  .soundState{font-size:14px;font-weight:700;color:var(--muted)}
  @media (max-width:900px){
    .main{grid-template-columns:minmax(0,1fr) 210px}
    .preset{display:none}
  }

  /* iPad Safari 横向き：ブラウザ上部UIが出ていても操作部まで1画面に収める */
  @media (orientation: landscape) and (max-height: 850px){
    .app{
      height:100dvh;
      min-height:0;
      padding:5px 9px;
      gap:5px;
      overflow:hidden;
    }
    .topbar{
      min-height:42px;
      gap:6px;
    }
    .title{
      font-size:clamp(22px,2.4vw,30px);
    }
    .main{
      min-height:0;
      gap:6px;
    }
    .scoreCard{
      min-height:0;
      padding:5px;
      overflow:hidden;
    }
    .scoreWrap{
      min-height:0;
      height:100%;
      overflow:hidden;
    }
    .scoreWrap img{
      width:100%;
      height:100%;
      object-fit:contain;
      object-position:center;
    }
    .side{
      min-height:0;
      gap:5px;
    }
    .nowCard{
      padding:8px;
    }
    .nowGroup{
      font-size:clamp(34px,4.6vw,54px);
      line-height:1.05;
    }
    .countdownBig{
      font-size:clamp(46px,7vw,70px);
      min-height:.95em;
    }
    .dots{
      padding:5px 8px;
    }
    .dot{
      width:30px;
      height:30px;
    }
    .footer{
      min-height:46px;
      gap:6px;
    }
    button{
      min-height:38px;
      padding:6px 11px;
    }
  }

</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="title">🎵 きれいなソラシ</div>
    <div class="spacer"></div>
    <div class="tempoBox" aria-label="テンポ設定">

      <button class="preset" data-bpm="104" type="button" aria-pressed="true">楽譜 104</button>
      <button class="preset" data-bpm="112" type="button">112</button>
    </div>
  </div>

  <div class="footer">
    <button class="primary" id="startBtn" type="button">▶ スタート</button>
    <button class="secondary" id="pauseBtn" type="button">⏸ 一時停止</button>
    <button id="resetBtn" type="button">↺ 最初から</button>
    <button id="soundBtn" type="button" aria-pressed="true">🔊 拍の音 ON</button>
    <span class="soundState">同じ高さの音で、1拍目だけ強く・2〜4拍目は弱く鳴ります</span>
  </div>
</div>

<script>
(() => {
  const bpmText = document.getElementById('bpmText');
  const groupText = document.getElementById('groupText');
  const roundText = document.getElementById('roundText');
  const instructionText = document.getElementById('instructionText');
  const statusText = document.getElementById('statusText');
  const countdownBig = document.getElementById('countdownBig');
  const cursor = document.getElementById('cursor');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const resetBtn = document.getElementById('resetBtn');
  const soundBtn = document.getElementById('soundBtn');
  const minusBtn = document.getElementById('minusBtn');
  const plusBtn = document.getElementById('plusBtn');
  const presets = [...document.querySelectorAll('.preset')];
  const dots = [0,1,2,3].map(i => document.getElementById('d'+i));

  let bpm = 104;
  let soundOn = true;
  let running = false;
  let paused = false;
  let phaseIndex = 0;
  let beatInPhase = 0;
  let timer = null;
  let audioCtx = null;

  const phases = [
    {group:'1列', round:'演奏', type:'play'},
    {group:'2列', round:'演奏', type:'play'},
    {group:'3列', round:'演奏', type:'play'}
  ];

  const PRECOUNT = 4;
  const SONG_BEATS = 32; // 8小節 × 4拍
  const GAP_BEATS = 2;

  function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }

  function setBpm(v){
    bpm = clamp(Math.round(v/4)*4, 60, 140);
    bpmText.textContent = bpm;
    presets.forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.bpm)===bpm)));
    if (running && !paused) restartTimer();
  }

  function beatMs(){ return 60000 / bpm; }

  function clickSound(accent=false){
    if (!soundOn) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();

      // Pitch stays the same on every beat.
      // Beat 1 is stronger; beats 2–4 are softer.
      o.frequency.value = 720;
      const peak = accent ? 0.16 : 0.055;

      g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(peak, audioCtx.currentTime + 0.003);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.04);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + 0.045);
    } catch(e) {}
  }

  function clearDots(){
    dots.forEach(d => d.classList.remove('on'));
  }

  function positionCursor(songBeat){
    const line = songBeat < 16 ? 0 : 1;
    const b = line === 0 ? songBeat : songBeat - 16;
    const startX = 10.8, endX = 92.0;
    const x = startX + (endX-startX) * (b / 15);
    cursor.style.left = x + '%';
    if (line === 0) {
      cursor.style.top = '25.5%';
      cursor.style.height = '22%';
    } else {
      cursor.style.top = '60.5%';
      cursor.style.height = '22%';
    }
    cursor.classList.remove('strong','weak');
    cursor.classList.add(songBeat % 4 === 0 ? 'strong' : 'weak');
    cursor.classList.add('show');
  }

  function render(){
    if (!running) return;
    const p = phases[phaseIndex];
    groupText.textContent = p.group;
    roundText.textContent = p.round;

    if (beatInPhase < PRECOUNT) {
      instructionText.textContent = 'よびはくを見て じゅんび';
      statusText.textContent = '吹かない列は、音を出さずに指だけ';
      countdownBig.textContent = String(PRECOUNT - beatInPhase);
      clearDots();
      dots[beatInPhase].classList.add('on');
      cursor.classList.remove('show','strong','weak');
      clickSound(beatInPhase===0);
    } else if (beatInPhase < PRECOUNT + SONG_BEATS) {
      instructionText.textContent = '演奏中';
      statusText.textContent = '自分の音をよく聞こう';
      countdownBig.textContent = '';
      clearDots();
      const songBeat = beatInPhase - PRECOUNT;
      positionCursor(songBeat);
      clickSound(songBeat % 4 === 0);
    } else {
      instructionText.textContent = 'つぎの人へ';
      statusText.textContent = 'リコーダーを口からはなして、じゅんび';
      countdownBig.textContent = '';
      clearDots();
      cursor.classList.remove('show','strong','weak');
    }
  }

  function tick(){
    if (!running || paused) return;
    render();
    beatInPhase++;
    const total = PRECOUNT + SONG_BEATS + GAP_BEATS;
    if (beatInPhase >= total) {
      beatInPhase = 0;
      phaseIndex++;
      if (phaseIndex >= phases.length) {
        finish();
      }
    }
  }

  function restartTimer(){
    if (timer) clearInterval(timer);
    timer = setInterval(tick, beatMs());
  }

  function start(){
    if (running && paused) {
      paused = false;
      pauseBtn.textContent = '⏸ 一時停止';
      instructionText.textContent = 'つづきから';
      restartTimer();
      return;
    }
    if (running) return;
    running = true; paused = false; phaseIndex = 0; beatInPhase = 0;
    startBtn.textContent = '演奏中…';
    pauseBtn.textContent = '⏸ 一時停止';
    tick();
    restartTimer();
  }

  function pause(){
    if (!running) return;
    paused = !paused;
    if (paused) {
      if (timer) clearInterval(timer);
      timer = null;
      pauseBtn.textContent = '▶ つづき';
      instructionText.textContent = '一時停止';
      statusText.textContent = '先生の合図で再開';
      countdownBig.textContent = '';
      cursor.classList.remove('show','strong','weak');
      clearDots();
    } else {
      pauseBtn.textContent = '⏸ 一時停止';
      restartTimer();
    }
  }

  function reset(){
    if (timer) clearInterval(timer);
    timer = null; running = false; paused = false; phaseIndex = 0; beatInPhase = 0;
    groupText.textContent = 'スタート前';
    roundText.textContent = 'テンポを選んでください';
    instructionText.textContent = '先生はスタートを押すだけ';
    statusText.textContent = '1列 → 2列 → 3列';
    startBtn.textContent = '▶ スタート';
    pauseBtn.textContent = '⏸ 一時停止';
    countdownBig.textContent = '';
    cursor.classList.remove('show','strong','weak');
    clearDots();
  }

  function finish(){
    if (timer) clearInterval(timer);
    timer = null; running = false; paused = false;
    groupText.textContent = 'おしまい！';
    roundText.textContent = 'リコーダータイム';
    instructionText.textContent = '今日、きれいに出た音は？';
    statusText.textContent = '前よりできるようになったことを1つ見つけよう';
    startBtn.textContent = '▶ もう一度';
    countdownBig.textContent = '';
    cursor.classList.remove('show','strong','weak');
    clearDots();
  }

  startBtn.addEventListener('click', start);
  pauseBtn.addEventListener('click', pause);
  resetBtn.addEventListener('click', reset);
  minusBtn.addEventListener('click', () => setBpm(bpm-4));
  plusBtn.addEventListener('click', () => setBpm(bpm+4));
  presets.forEach(b => b.addEventListener('click', () => setBpm(Number(b.dataset.bpm))));
  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    soundBtn.setAttribute('aria-pressed', String(soundOn));
    soundBtn.textContent = soundOn ? '🔊 拍の音 ON' : '🔇 拍の音 OFF';
  });
})();
</script>
</body>
</html>
