<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ゆかいな木きん｜4小節パート練習</title>
<style>
  :root {
    --red:#d7332f; --blue:#2f66d7; --ink:#17202a; --line:#d9dde4;
    --bg:#f4f6f8; --panel:#ffffff; --accent:#1f4b7a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:var(--ink)}
  body{height:100dvh}
  .app{height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:6px;padding:7px 10px 8px}
  .top{display:grid;grid-template-columns:1.05fr 1.15fr .9fr;gap:8px;align-items:stretch}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 9px;min-width:0}
  .label{font-size:12px;font-weight:800;color:#66707b;margin-bottom:4px;white-space:nowrap}
  .buttons{display:flex;gap:5px;flex-wrap:wrap}
  button{font:inherit;border:1px solid #c7ccd3;background:#fff;border-radius:9px;padding:7px 10px;font-weight:800;color:#24313d;cursor:pointer}
  button.active{background:#e7f0fb;border-color:#5e86b1;color:#143b64;box-shadow:inset 0 0 0 1px #5e86b1}
  button:disabled{opacity:.45}
  .sectionBtn{min-width:66px}
  .partBtn{min-width:72px}
  .tempoRow{display:flex;align-items:center;gap:6px;justify-content:center}
  .tempoValue{min-width:78px;text-align:center;font-size:19px;font-weight:900}
  .smallBtn{padding:6px 11px;font-size:18px;line-height:1}
  .preset{padding:5px 8px;font-size:13px}
  .stage{position:relative;min-height:0;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;
    display:grid;grid-template-rows:auto 1fr}
  .statusbar{height:54px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border-bottom:1px solid #eceff2;padding:3px 12px}
  .statusMain{font-size:34px;font-weight:950;letter-spacing:.02em;text-align:center;grid-column:2}
  .statusSub{font-size:14px;font-weight:850;color:#69727c;justify-self:start;grid-column:1;grid-row:1}
  .beatpair{display:flex;gap:5px;align-items:center;justify-self:end;grid-column:3;grid-row:1}
  .beatdot{width:18px;height:18px;border-radius:50%;opacity:.2}
  .beatdot.red{background:var(--red)} .beatdot.blue{background:var(--blue)}
  .beatdot.on{opacity:1;transform:scale(1.12);box-shadow:0 0 0 3px rgba(0,0,0,.08)}
  .scoreWrap{position:relative;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 10px 5px;background:#fff}
  #score{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
  #cursor{position:absolute;top:7%;bottom:7%;width:5px;border-radius:4px;display:none;pointer-events:none;
    box-shadow:0 0 0 1px rgba(255,255,255,.75)}
  #countdown{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    font-size:min(28vw,190px);font-weight:950;background:rgba(255,255,255,.76);z-index:4}
  #countdown.show{display:flex}
  .footer{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
  .summary{font-size:13px;font-weight:750;color:#606a74;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:5px}
  .mainControls{display:flex;gap:7px;justify-content:center}
  .mainControls button{padding:10px 18px;font-size:16px;min-width:98px}
  #startBtn{background:#1f6f43;color:white;border-color:#1f6f43}
  #pauseBtn{background:#fff7df;border-color:#e2bb50}
  #resetBtn{background:#f7f7f7}
  .sound{justify-self:end}
  #soundBtn{padding:9px 13px}
  @media (max-height:620px) {
    .app{padding:5px 8px 6px;gap:4px}
    .panel{padding:5px 7px;border-radius:10px}
    .label{font-size:11px;margin-bottom:3px}
    button{padding:5px 8px;font-size:13px}
    .partBtn,.sectionBtn{min-width:58px}
    .tempoValue{font-size:17px;min-width:70px}
    .statusbar{height:42px}
    .statusMain{font-size:27px}
    .statusSub{font-size:12px}
    .mainControls button{padding:8px 14px;font-size:14px;min-width:88px}
    #soundBtn{padding:7px 10px}
  }
  @media (max-width:900px) {
    .top{grid-template-columns:1.1fr 1.15fr .85fr}
    .buttons{gap:4px}
    button{padding-left:7px;padding-right:7px}
  }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="panel">
      <div class="label">① 練習する4小節（複数選択）</div>
      <div class="buttons" id="sectionBtns">
        <button class="sectionBtn active" data-sec="1-4">1〜4</button>
        <button class="sectionBtn" data-sec="5-8">5〜8</button>
        <button class="sectionBtn" data-sec="9-12">9〜12</button>
        <button class="sectionBtn" data-sec="13-16">13〜16</button>
      </div>
    </div>

    <div class="panel">
      <div class="label">② パート</div>
      <div class="buttons" id="partBtns">
        <button class="partBtn active" data-part="song">うた</button>
        <button class="partBtn" data-part="rec">リコーダー</button>
        <button class="partBtn" data-part="kh1">けんハモ①</button>
        <button class="partBtn" data-part="kh2">けんハモ②</button>
      </div>
    </div>

    <div class="panel">
      <div class="label">③ テンポ</div>
      <div class="tempoRow">
        <button class="smallBtn" id="tempoDown">−</button>
        <div class="tempoValue">♩=<span id="tempo">100</span></div>
        <button class="smallBtn" id="tempoUp">＋</button>
      </div>
      <div class="buttons" style="justify-content:center;margin-top:4px">
        <button class="preset" data-bpm="80">80</button>
        <button class="preset" data-bpm="92">92</button>
        <button class="preset active" data-bpm="100">100</button>
        <button class="preset" data-bpm="108">108</button>
      </div>
    </div>
  </div>

  <main class="stage">
    <div class="statusbar">
      <div class="statusMain" id="statusMain">1列</div>
      <div class="statusSub" id="statusSub">1〜4小節・うた</div>
      <div class="beatpair">
        <span class="beatdot red" id="beat1"></span>
        <span class="beatdot blue" id="beat2"></span>
      </div>
    </div>
    <div class="scoreWrap" id="scoreWrap">
      <img id="score" alt="選択したパートの楽譜">
      <div id="cursor"></div>
      <div id="countdown">4</div>
    </div>
  </main>

  <footer class="footer">
    <div class="summary" id="summary">練習：1〜4小節</div>
    <div class="mainControls">
      <button id="startBtn">▶ スタート</button>
      <button id="pauseBtn">Ⅱ 一時停止</button>
      <button id="resetBtn">↺ リセット</button>
    </div>
    <div class="sound"><button id="soundBtn">🔊 音 ON</button></div>
  </footer>
</div>

function updateSummary(){
  const arr = orderedSelected();
  summary.textContent = "練習：" + (arr.length ? arr.map(s=>s.replace("-", "〜")).join("・") + "小節" : "区間を選んでください");
}
function showScore(sec){
  score.src = ASSETS[sec][currentPart];
}
function resetVisual(){
  countdown.classList.remove("show");
  cursor.style.display = "none";
  b1.classList.remove("on"); b2.classList.remove("on");
}
function setCursorForBeat(i){
  // 4小節 × 2拍 = 8拍。楽譜左右端の余白を避けて移動。
  const left = 7 + (i / 7) * 86;
  cursor.style.left = left + "%";
  cursor.style.background = (i % 2 === 0) ? "var(--red)" : "var(--blue)";
  cursor.style.display = "block";
}
function setBeatLight(i){
  const first = i % 2 === 0;
  b1.classList.toggle("on", first);
  b2.classList.toggle("on", !first);
}
function ensureAudio(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === "suspended") audioCtx.resume();
}
function clickSound(strong){
  if(!soundOn) return;
  ensureAudio();
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.frequency.value = 880; // 強弱のみ変え、音程は同じ
  g.gain.setValueAtTime(strong ? 0.12 : 0.055, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.055);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + 0.06);
}
function beatMs(){ return 60000 / bpm; }

function buildSequence(){
  // 列ごとに、選んだ区間を止めずに連続して練習する。
  sequence = [1,2,3];
}
function selectedRangeLabel(){
  const secs = orderedSelected();
  if(!secs.length) return "";
  if(secs.length === 1) return secs[0].replace("-", "〜");
  // 連続選択を想定して、最初の開始小節〜最後の終了小節で表示
  const first = secs[0].split("-")[0];
  const last = secs[secs.length-1].split("-")[1];
  return first + "〜" + last;
}
function startCurrent(){
  if(seqIndex >= sequence.length){
    finishAll(); return;
  }
  const row = sequence[seqIndex];
  const secs = orderedSelected();
  if(!secs.length){ finishAll(); return; }

  currentSectionIndex = 0;
  showScore(secs[0]);
  statusMain.textContent = row + "列";
  statusSub.textContent = selectedRangeLabel() + "小節　" + partNames[currentPart] + "　準備";

  phase = "count";
  countdownN = 4;
  beatIndex = 0;
  countdown.textContent = countdownN;
  countdown.classList.add("show");
  cursor.style.display = "none";
  scheduleNext(0);
}
function tick(){
  if(!running || paused) return;
  const row = sequence[seqIndex];
  const secs = orderedSelected();

  if(phase === "count"){
    countdown.textContent = countdownN;
    countdown.classList.add("show");
    const countBeat = 4 - countdownN;
    setBeatLight(countBeat);
    clickSound(countBeat % 2 === 0);
    countdownN--;
    if(countdownN === 0){
      phase = "play";
      beatIndex = 0;
      currentSectionIndex = 0;
      showScore(secs[0]);
      statusMain.textContent = row + "列";
      statusSub.textContent = selectedRangeLabel() + "小節　" + partNames[currentPart] + "　演奏";
    }
    scheduleNext(beatMs());

  } else if(phase === "play"){
    countdown.classList.remove("show");

    // 4小節=8拍。区間の境目でも停止せず、そのまま次の楽譜へ切り替える。
    const wantedSectionIndex = Math.floor(beatIndex / 8);
    const localBeat = beatIndex % 8;

    if(wantedSectionIndex !== currentSectionIndex && wantedSectionIndex < secs.length){
      currentSectionIndex = wantedSectionIndex;
      showScore(secs[currentSectionIndex]);
    }

    setCursorForBeat(localBeat);
    setBeatLight(beatIndex);
    clickSound(beatIndex % 2 === 0);
    beatIndex++;

    if(beatIndex >= 8 * secs.length){
      phase = "gap";
      statusMain.textContent = row + "列";
      statusSub.textContent = "できました";
      scheduleNext(beatMs()*2);
    } else {
      scheduleNext(beatMs());
    }

  } else if(phase === "gap"){
    seqIndex++;
    if(seqIndex >= sequence.length) finishAll();
    else startCurrent();
  }
}
function scheduleNext(ms){
  clearTimeout(timer);
  timerStartedAt = performance.now();
  pauseRemaining = ms;
  timer = setTimeout(tick, ms);
}
function finishAll(){
  running=false; paused=false;
  clearTimeout(timer);
  resetVisual();
  statusMain.textContent = "終了！";
  statusSub.textContent = "1列・2列・3列　練習できました";
  document.getElementById("startBtn").textContent = "▶ スタート";
  unlockSettings(false);
}
function unlockSettings(lock){
  document.querySelectorAll(".sectionBtn,.partBtn,.preset,#tempoDown,#tempoUp").forEach(el=>el.disabled=lock);
}
function start(){
  if(running && paused){
    paused=false;
    document.getElementById("pauseBtn").textContent = "Ⅱ 一時停止";
    scheduleNext(pauseRemaining ?? 0);
    return;
  }
  if(running) return;
  if(orderedSelected().length === 0){
    statusSub.textContent = "練習する小節を選んでください";
    return;
  }
  ensureAudio();
  buildSequence();
  seqIndex=0; running=true; paused=false;
  unlockSettings(true);
  document.getElementById("startBtn").textContent = "▶ 演奏中";
  document.getElementById("pauseBtn").textContent = "Ⅱ 一時停止";
  startCurrent();
}
function pause(){
  if(!running) return;
  if(!paused){
    paused=true;
    clearTimeout(timer);
    const elapsed = performance.now()-timerStartedAt;
    pauseRemaining = Math.max(0,(pauseRemaining ?? 0)-elapsed);
    document.getElementById("pauseBtn").textContent = "▶ 再開";
    statusSub.textContent += "（一時停止）";
  } else {
    start();
  }
}
function reset(){
  running=false; paused=false; clearTimeout(timer);
  seqIndex=0; phase="idle"; beatIndex=0; currentSectionIndex=0;
  resetVisual();
  unlockSettings(false);
  document.getElementById("startBtn").textContent = "▶ スタート";
  document.getElementById("pauseBtn").textContent = "Ⅱ 一時停止";
  const first = orderedSelected()[0] || "1-4";
  showScore(first);
  statusMain.textContent = "1列";
  statusSub.textContent = (selectedRangeLabel() || "1〜4") + "小節　" + partNames[currentPart];
}

// --- 上部操作ボタン ---
document.querySelectorAll(".sectionBtn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    if(running) return;
    const sec = btn.dataset.sec;

    if(selectedSecs.has(sec)){
      // 最低1区間は残す
      if(selectedSecs.size === 1) return;
      selectedSecs.delete(sec);
    }else{
      selectedSecs.add(sec);
    }

    document.querySelectorAll(".sectionBtn").forEach(b=>{
      b.classList.toggle("active", selectedSecs.has(b.dataset.sec));
    });

    updateSummary();
    const first = orderedSelected()[0];
    if(first) showScore(first);
    statusMain.textContent = "1列";
    statusSub.textContent = selectedRangeLabel() + "小節　" + partNames[currentPart];
  });
});

document.querySelectorAll(".partBtn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    if(running) return;
    currentPart = btn.dataset.part;

    document.querySelectorAll(".partBtn").forEach(b=>{
      b.classList.toggle("active", b === btn);
    });

    const first = orderedSelected()[0] || "1-4";
    showScore(first);
    statusMain.textContent = "1列";
    statusSub.textContent = selectedRangeLabel() + "小節　" + partNames[currentPart];
  });
});

function setTempo(v){
  bpm = Math.max(60, Math.min(140, v));
  tempoEl.textContent = bpm;

  document.querySelectorAll(".preset").forEach(b=>{
    b.classList.toggle("active", Number(b.dataset.bpm) === bpm);
  });
}

document.getElementById("tempoDown").addEventListener("click",()=>{
  if(!running) setTempo(bpm - 4);
});
document.getElementById("tempoUp").addEventListener("click",()=>{
  if(!running) setTempo(bpm + 4);
});
document.querySelectorAll(".preset").forEach(btn=>{
  btn.addEventListener("click",()=>{
    if(!running) setTempo(Number(btn.dataset.bpm));
  });
});

document.getElementById("startBtn").onclick=start;
document.getElementById("pauseBtn").onclick=pause;
document.getElementById("resetBtn").onclick=reset;
document.getElementById("soundBtn").onclick=()=>{
  soundOn=!soundOn;
  document.getElementById("soundBtn").textContent=soundOn?"🔊 音 ON":"🔇 音 OFF";
  if(soundOn) ensureAudio();
};

updateSummary();
showScore("1-4");
statusMain.textContent = "1列";
statusSub.textContent = "1〜4小節　うた";
</script>
</body>
</html>
